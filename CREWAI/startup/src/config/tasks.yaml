# =============================================================================
# 三层Agent任务配置
# 文件: src/config/tasks.yaml
# 说明: 定义规划、实施、调用三个任务
# =============================================================================

# -----------------------------------------------------------------------------
# 规划任务 - 分析用户意图
# -----------------------------------------------------------------------------
planning_task:
  description: >
    用户语音指令: {user_command}

    可用的MCP Server能力列表:
    {available_capabilities}

    请分析用户的指令，理解用户想要实现什么视频处理效果。

    你需要:
    1. 识别用户想要的具体功能（如：调整音量、改变亮度、应用滤镜等）
    2. 确定需要调用哪些MCP Server
    3. 判断这些操作的先后顺序
    4. 考虑参数的合理范围

  expected_output: >
    一份结构化的规划报告，包含:
    - 用户意图摘要
    - 需要的MCP Server列表
    - 每个Server需要调用的工具
    - 建议的参数值
    - 执行顺序说明

  agent: planner_agent

# -----------------------------------------------------------------------------
# 实施任务 - 生成TODO列表
# -----------------------------------------------------------------------------
execution_planning_task:
  description: >
    基于规划Agent的分析结果，生成详细的执行步骤。

    请将规划转化为具体的TODO列表，每一步都要包含:
    1. 步骤编号
    2. 要调用的Server名称
    3. 要调用的工具名称
    4. 工具参数（JSON格式）
    5. 预期结果描述

  expected_output: >
    一个结构化的TODO列表，格式如下:

    ```json
    {
      "steps": [
        {
          "step": 1,
          "server_name": "volume-control",
          "tool_name": "set_volume",
          "arguments": {"level": 80},
          "description": "将音量设置为80"
        }
      ]
    }
    ```

  agent: executor_agent
  context:
    - planning_task

# -----------------------------------------------------------------------------
# 调用任务 - 执行MCP调用
# -----------------------------------------------------------------------------
calling_task:
  description: >
    按照TODO列表，依次调用MCP Server工具。

    对于每一步:
    1. 调用指定的Server和工具
    2. 传递正确的参数
    3. 记录执行结果
    4. 如果失败，记录错误信息

    最后生成执行报告。

  expected_output: >
    一份执行报告，包含:
    - 总步骤数
    - 成功步骤数
    - 失败步骤数
    - 每一步的详细结果
    - 最终状态摘要

  agent: caller_agent
  context:
    - execution_planning_task
