<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS 视频控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .scene-btn {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .scene-btn:hover { background: #667eea; }
        .scene-btn.active {
            background: #667eea;
            box-shadow: 0 0 10px #667eea;
        }
        .audio-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #0f3460;
            margin: 8px 0;
            border-radius: 8px;
        }
        .audio-name { flex: 1; }
        .audio-item input[type="range"] {
            flex: 2;
            margin: 0 15px;
        }
        .audio-value {
            width: 50px;
            text-align: right;
        }
        #status {
            color: #4ade80;
            font-size: 14px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        #videoPreview {
            width: 100%;
            max-height: 400px;
            display: block;
        }
        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #667eea;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .start-btn:hover { background: #764ba2; }
        .start-btn.hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OBS 视频控制台</h1>

        <div class="panel">
            <h2>视频预览</h2>
            <div class="video-container">
                <video id="videoPreview" autoplay playsinline></video>
                <button id="startVideo" class="start-btn">点击启动视频</button>
            </div>
        </div>

        <div class="panel">
            <h2>场景切换</h2>
            <div id="scenes"></div>
        </div>

        <div class="panel">
            <h2>音频控制</h2>
            <div id="audio"></div>
        </div>

        <div class="panel">
            <h2>状态</h2>
            <div id="status">正在连接...</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
