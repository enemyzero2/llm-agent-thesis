[project]
name = "startup"
version = "0.1.0"
description = "startup using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.86.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "obs-websocket-py>=1.0.0",
    "mcp>=1.0.0",
    "anthropic>=0.77.0",
    "litellm>=1.75.3",
    "fastapi>=0.128.0",
    "apscheduler>=3.11.2",
]

[project.scripts]
startup = "startup.main:run"
run_crew = "startup.main:run"
train = "startup.main:train"
replay = "startup.main:replay"
test = "startup.main:test"
run_with_trigger = "startup.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.crewai]
type = "crew"
